<!DOCTYPE html>
<html>
<head>
    <title>Fashion Glow  - Trendy Fashion Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#f8f9fc; color:#333; }

        header { background:#111; color:#fff; padding:15px 20px; position:sticky; top:0; }
        .container { max-width:1200px; margin:auto; }
        .nav-bar { display:flex; justify-content:space-between; align-items:center; }

        .logo span { color:#ff4d6d; }

        .hero { background:linear-gradient(to right,#ff4d6d,#ff758f); color:#fff; padding:60px 20px; text-align:center; }

        .section { padding:40px 15px; }
        .section h2 { text-align:center; margin-bottom:30px; }

        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:15px; }

        .card {
            background:#fff; padding:12px; border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08); text-align:center;
        }

        .card img { width:100%; height:200px; object-fit:cover; border-radius:10px; }

        .buy-btn {
            background:#ff4d6d; color:#fff; padding:8px 12px;
            border:none; border-radius:20px; margin-top:8px; cursor:pointer;
        }

        footer { background:#111; color:#fff; text-align:center; padding:20px; margin-top:40px; }
    </style>
</head>

<body>

<header>
    <div class="container nav-bar">
        <h1>Fashion <span>Glow</span></h1>
    </div>
</header>

<section class="hero">
    <h2>Shop Trendy Fashion</h2>
</section>

<section class="section">
    <h2>Products</h2>
    <div class="grid" id="productGrid"></div>
</section>

<footer>
    <p>© 2026 Fashion Adda</p>
</footer>

<!-- ✅ JavaScript always inside script tag -->
<script>
const products = [
  {
    name: "Chest Sling Bag",
    image: "https://m.media-amazon.com/images/I/61fpk3kw8BL._SX679_.jpg",
    link: "https://amzn.to/4bGqWjX"
  },
  {
    name: "Beige Square Neck Top",
    image: "https://m.media-amazon.com/images/I/71example.jpg",
    link: "https://www.amazon.in/dp/B0FLK4B4FL"
  },
  {
    name: "Braided Leather Bracelet",
    image: "https://m.media-amazon.com/images/I/61example.jpg",
    link: "https://www.amazon.in/dp/B0FHWT3PFS"
  }
];

const grid = document.getElementById("productGrid");

products.forEach(p => {
  grid.innerHTML += `
    <div class="card">
      <a href="${p.link}" target="_blank">
        <img src="${p.image}">
      </a>
      <h4>${p.name}</h4>
      <a href="${p.link}" target="_blank">
        <button class="buy-btn">Buy on Amazon</button>
      </a>
    </div>
  `;
});
</script>

</body>
</html>
