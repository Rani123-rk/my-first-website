<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex</title>
</head>
<body>
    <form>
        <label for="phone">Phone Number:</label>
        <input for="text" id="phone" pattern="^9+\d{3}-\d{3}-\d{4}$" title="Formate:123-456-7890" required>
        <input type="submit" value="submit">
    </form>
</body>
</html>
